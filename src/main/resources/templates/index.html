<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SpendWise - Student Expense Tracker</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            color: #222;
        }

        .navbar {
            background: #1f2937;
            color: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h1 {
            font-size: 25px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            background: #2563eb;
            padding: 10px 18px;
            border-radius: 7px;
        }

        .container {
            width: 84%;
            max-width: 1100px;
            margin: 35px auto;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h2 {
            margin-bottom: 8px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .card h3 {
            color: #6b7280;
            font-size: 15px;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 27px;
            font-weight: bold;
        }

        .expense-section {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .expense-section h2 {
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            text-align: left;
            padding: 14px;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #f9fafb;
        }

        .delete {
            color: #dc2626;
            text-decoration: none;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #6b7280;
        }

        @media (max-width: 700px) {
            .cards {
                grid-template-columns: 1fr;
            }

            .container {
                width: 94%;
            }

            table {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

<nav class="navbar">
    <h1>💰 SpendWise</h1>
    <a href="/add">+ Add Expense</a>
</nav>

<div class="container">

    <div class="welcome">
        <h2>Student Expense Dashboard</h2>
        <p>Track and manage your daily spending.</p>
    </div>

  <div class="expense-section" style="margin-bottom: 30px;">

    <h2>Budget Progress</h2>

    <p style="margin-bottom: 10px;">
        <strong th:text="${#numbers.formatDecimal(budgetPercentage, 1, 1)}">
            0
        </strong>% of your budget used
    </p>

    <div style="
        width: 100%;
        height: 18px;
        background: #e5e7eb;
        border-radius: 10px;
        overflow: hidden;
    ">

        <div th:style="'width:' + ${budgetPercentage > 100 ? 100 : budgetPercentage} + '%;
                        height:100%;
                        background:#2563eb;'">
        </div>

    </div>

    <a href="/budget"
       style="
       display:inline-block;
       margin-top:15px;
       color:#2563eb;
       text-decoration:none;
       font-weight:bold;">
        ⚙ Manage Budget
    </a>

</div>
    <div class="expense-section">

        <h2>Recent Expenses</h2>

        <table th:if="${not #lists.isEmpty(expenses)}">

            <thead>
            <tr>
                <th>Description</th>
                <th>Category</th>
                <th>Amount</th>
                <th>Date</th>
                <th>Action</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="expense : ${expenses}">

                <td th:text="${expense.description}"></td>

                <td th:text="${expense.category}"></td>

                <td>₹<span th:text="${expense.amount}"></span></td>

                <td th:text="${expense.date}"></td>

                <td>
                    <a class="delete"
                       th:href="@{/delete/{id}(id=${expense.id})}"
                       onclick="return confirm('Delete this expense?')">
                        Delete
                    </a>
                </td>

            </tr>

            </tbody>

        </table>

        <div class="empty" th:if="${#lists.isEmpty(expenses)}">
            No expenses recorded yet.
            Click <strong>+ Add Expense</strong> to get started.
        </div>

    </div>

</div>

</body>
</html>
