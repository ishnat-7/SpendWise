<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Expense - SpendWise</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            padding: 40px 20px;
        }

        .form-container {
            max-width: 550px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="form-container">

    <h1>Add Expense</h1>

    <p class="subtitle">
        Record a new expense in your SpendWise account.
    </p>

    <form th:action="@{/add}" th:object="${expense}" method="post">

        <label>Description</label>
        <input type="text"
               th:field="*{description}"
               placeholder="e.g. Lunch at college"
               required>

        <label>Amount (₹)</label>
        <input type="number"
               th:field="*{amount}"
               placeholder="e.g. 150"
               min="1"
               step="0.01"
               required>

        <label>Category</label>

        <select th:field="*{category}" required>
            <option value="">Select category</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Education">Education</option>
            <option value="Shopping">Shopping</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Hostel">Hostel</option>
            <option value="Health">Health</option>
            <option value="Other">Other</option>
        </select>

        <label>Date</label>

        <input type="date"
               th:field="*{date}">

        <button type="submit">
            Add Expense
        </button>

    </form>

    <a class="back" href="/">
        ← Back to Dashboard
    </a>

</div>

</body>
</html>
